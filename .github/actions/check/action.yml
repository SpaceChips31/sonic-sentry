name: Check SonicSentry
description: Install dependencies, compile source and run the shared test suite
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      shell: bash
    - run: python -m compileall -q app validator
      shell: bash
    - run: python -m pytest -q
      shell: bash
