name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: |
          docker build \
            --build-arg VERSION=0.4.1-dev \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag sonic-sentry:ci .
      - name: Verify real FLAC analysis and file routing
        run: docker run --rm -i sonic-sentry:ci python - < scripts/smoke-container.py
      - name: Verify separate media group access and ACL handling
        run: docker run --rm --user 0:0 -i sonic-sentry:ci python - < scripts/smoke-permissions.py
