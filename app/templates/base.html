<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lossless Validator{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
    <link rel="stylesheet" href="/static/app.css?v=3">
    <link rel="stylesheet" href="/static/desktop.css?v=4">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/"><img src="/static/favicon.svg?v=2" alt="">Lossless Validator</a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="/">Dashboard</a>

</html>
