name: sonic-sentry

x-app: &app
  image: "${LOSSLESS_VALIDATOR_IMAGE:-git.spacechips.it/chips/sonic-sentry}:${LOSSLESS_VALIDATOR_VERSION:-0.1.0}"
  user: "${PUID:-1000}:${PGID:-1000}"
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  environment: &app-environment
    LOSSLESS_VALIDATOR_VERSION: "${LOSSLESS_VALIDATOR_VERSION:-0.1.0}"
    LOSSLESS_VALIDATOR_DATA_DIR: /app/data
    LOSSLESS_REPORT_ROOT: /app/reports
    LOSSLESS_UPLOAD_ROOT: /app/uploads
    LOSSLESS_SOURCE_ROOTS: "${LOSSLESS_SOURCE_ROOTS:-/data/downloads/soulseek:/data/music/legacy}"
  volumes: &app-volumes
    - ./data:/app/data
    - ./reports:/app/reports
    - ./uploads:/app/uploads
    - "${MEDIA_ROOT:-/mnt/media}:/data:ro"

services:
  web:
    <<: *app
    container_name: sonic-sentry-web
    ports:
      - "${LOSSLESS_VALIDATOR_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

  worker:
    <<: *app
    container_name: sonic-sentry-worker
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
