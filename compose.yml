name: sonic-sentry

x-app: &app
  image: "${LOSSLESS_VALIDATOR_IMAGE:-ghcr.io/spacechips31/sonic-sentry}:${LOSSLESS_VALIDATOR_VERSION:-0.1.0}"
  user: "${PUID:-1000}:${PGID:-1000}"
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  environment: &app-environment
    LOSSLESS_VALIDATOR_VERSION: "${LOSSLESS_VALIDATOR_VERSION:-0.1.0}"
    LOSSLESS_VALIDATOR_DATA_DIR: /app/data
    LOSSLESS_REPORT_ROOT: /app/reports
    LOSSLESS_UPLOAD_ROOT: /app/uploads
    LOSSLESS_SOURCE_ROOTS: "${LOSSLESS_SOURCE_ROOTS:-/data/downloads/soulseek:/data/music/legacy}"
    LOSSLESS_FILE_OPERATIONS: "${LOSSLESS_FILE_OPERATIONS:-false}"
    LOSSLESS_AUTO_ROUTE: "${LOSSLESS_AUTO_ROUTE:-false}"
    LOSSLESS_MOVABLE_ROOTS: "${LOSSLESS_MOVABLE_ROOTS:-/data/downloads/soulseek:/data/music/legacy:/data/music/validator/quarantine:/data/music/validator/rejected}"
    LOSSLESS_STAGING_ROOT: "${LOSSLESS_STAGING_ROOT:-/data/music/validator/staging}"
    LOSSLESS_QUARANTINE_ROOT: "${LOSSLESS_QUARANTINE_ROOT:-/data/music/validator/quarantine}"
    LOSSLESS_REJECTED_ROOT: "${LOSSLESS_REJECTED_ROOT:-/data/music/validator/rejected}"
  volumes: &app-volumes
    - ./data:/app/data
    - ./reports:/app/reports
    - ./uploads:/app/uploads
    - "${MEDIA_ROOT:-/mnt/media}:/data"

services:
  web:
    <<: *app
    container_name: sonic-sentry-web
    ports:
      - "${LOSSLESS_VALIDATOR_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

  worker:
    <<: *app
    container_name: sonic-sentry-worker
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
