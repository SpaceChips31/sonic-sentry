name: sonic-sentry

x-app: &app
  image: "${SONIC_SENTRY_IMAGE:-ghcr.io/spacechips31/sonic-sentry:0.1.1}"
  user: "${PUID:-1000}:${PGID:-1000}"
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  environment: &app-environment
    - LOSSLESS_VALIDATOR_DATA_DIR=/app/data
    - LOSSLESS_REPORT_ROOT=/app/reports
    - LOSSLESS_UPLOAD_ROOT=/app/uploads
    - LOSSLESS_SOURCE_ROOTS
    - LOSSLESS_FILE_OPERATIONS
    - LOSSLESS_AUTO_ROUTE
    - LOSSLESS_MOVABLE_ROOTS
    - LOSSLESS_STAGING_ROOT
    - LOSSLESS_QUARANTINE_ROOT
    - LOSSLESS_REJECTED_ROOT
    - SONIC_SENTRY_WORKER_CONCURRENCY
    - SONIC_SENTRY_AUTH_ENABLED
    - SONIC_SENTRY_SECRET_KEY
  volumes: &app-volumes
    - ./data:/app/data
    - ./reports:/app/reports
    - ./uploads:/app/uploads
    - "${MEDIA_ROOT:-/mnt/media}:/data"

services:
  web:
    <<: *app
    container_name: sonic-sentry-web
    ports:
      - "${LOSSLESS_VALIDATOR_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

  worker:
    <<: *app
    container_name: sonic-sentry-worker
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
