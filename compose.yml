services:
  web:
    build:
      context: .
      args:
        AUDIO_FORENSIC_COMMIT: b10cab6f29e9a43677e3adae97a7c39e0793268
    image: spacechips/lossless-validator:local
    container_name: lossless-validator-web
    user: "${PUID}:${PGID}"
    environment:
      LOSSLESS_VALIDATOR_DATA_DIR: /app/data
      LOSSLESS_REPORT_ROOT: /app/reports
      LOSSLESS_UPLOAD_ROOT: /app/uploads
      LOSSLESS_SOURCE_ROOTS: /data/downloads/soulseek:/data/music/legacy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - /mnt/media/music/validator/uploads:/app/uploads
      - /mnt/media/downloads/soulseek:/data/downloads/soulseek:ro
      - /mnt/media/music/legacy:/data/music/legacy:ro
    ports:
      - "${LOSSLESS_VALIDATOR_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: spacechips/lossless-validator:local
    container_name: lossless-validator-worker
    user: "${PUID}:${PGID}"
    command: ["python", "-m", "app.worker"]
    environment:
      LOSSLESS_VALIDATOR_DATA_DIR: /app/data
      LOSSLESS_REPORT_ROOT: /app/reports
      LOSSLESS_UPLOAD_ROOT: /app/uploads
      LOSSLESS_SOURCE_ROOTS: /data/downloads/soulseek:/data/music/legacy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - /mnt/media/music/validator/uploads:/app/uploads
      - /mnt/media/downloads/soulseek:/data/downloads/soulseek:ro
      - /mnt/media/music/legacy:/data/music/legacy:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
