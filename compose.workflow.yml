services:
  web:
    environment:
      LOSSLESS_FILE_OPERATIONS: "${LOSSLESS_FILE_OPERATIONS:-true}"
      LOSSLESS_AUTO_ROUTE: "${LOSSLESS_AUTO_ROUTE:-true}"
      LOSSLESS_SOURCE_ROOTS: /workflow/inbox:/workflow/legacy
      LOSSLESS_MOVABLE_ROOTS: /workflow/inbox:/workflow/legacy:/workflow/quarantine:/workflow/rejected
      LOSSLESS_STAGING_ROOT: /workflow/staging
      LOSSLESS_QUARANTINE_ROOT: /workflow/quarantine
      LOSSLESS_REJECTED_ROOT: /workflow/rejected
    volumes:
      - "${LOSSLESS_INBOX_HOST:-/mnt/media/downloads/soulseek}:/workflow/inbox"
      - "${LOSSLESS_LEGACY_HOST:-/mnt/media/music/legacy}:/workflow/legacy"
      - "${LOSSLESS_STAGING_HOST:-/mnt/media/music/validator/staging}:/workflow/staging"
      - "${LOSSLESS_QUARANTINE_HOST:-/mnt/media/music/validator/quarantine}:/workflow/quarantine"
      - "${LOSSLESS_REJECTED_HOST:-/mnt/media/music/validator/rejected}:/workflow/rejected"

  worker:
    environment:
      LOSSLESS_FILE_OPERATIONS: "${LOSSLESS_FILE_OPERATIONS:-true}"
      LOSSLESS_AUTO_ROUTE: "${LOSSLESS_AUTO_ROUTE:-true}"
      LOSSLESS_SOURCE_ROOTS: /workflow/inbox:/workflow/legacy
      LOSSLESS_MOVABLE_ROOTS: /workflow/inbox:/workflow/legacy:/workflow/quarantine:/workflow/rejected
      LOSSLESS_STAGING_ROOT: /workflow/staging
      LOSSLESS_QUARANTINE_ROOT: /workflow/quarantine
      LOSSLESS_REJECTED_ROOT: /workflow/rejected
    volumes:
      - "${LOSSLESS_INBOX_HOST:-/mnt/media/downloads/soulseek}:/workflow/inbox"
      - "${LOSSLESS_LEGACY_HOST:-/mnt/media/music/legacy}:/workflow/legacy"
      - "${LOSSLESS_STAGING_HOST:-/mnt/media/music/validator/staging}:/workflow/staging"
      - "${LOSSLESS_QUARANTINE_HOST:-/mnt/media/music/validator/quarantine}:/workflow/quarantine"
      - "${LOSSLESS_REJECTED_HOST:-/mnt/media/music/validator/rejected}:/workflow/rejected"
